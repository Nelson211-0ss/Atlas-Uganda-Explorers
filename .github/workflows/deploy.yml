jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: Add your build step here if your site needs to be compiled
      # - name: Build
      #   run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The exact command wrangler uses to deploy static assets to pages
          command: pages deploy . --project-name=atlas-uganda-explorers
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
